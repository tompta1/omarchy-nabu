# Nabu owns its boot chain. Keep the Arch Linux ARM/Nabu systemd initramfs
# baseline after Omarchy's generic Limine/Btrfs drop-ins have been sourced.
# A userspace build under QEMU must never autodetect the builder's hardware.
MODULES=(btrfs)
HOOKS=(base systemd modconf kms keyboard sd-vconsole block filesystems fsck)
