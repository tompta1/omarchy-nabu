# OS-11: systemd initramfs with upstream read-only Btrfs snapshot overlay.
# Never autodetect the QEMU builder's hardware. The hook comes from the signed
# limine-mkinitcpio-hook package; firmware/DTB remain Nabu-specific.
MODULES=(btrfs overlay)
# Built-in Adreno probes before the root filesystem is mounted.
FILES+=(
    /usr/lib/firmware/qcom/a630_sqe.fw
    /usr/lib/firmware/qcom/a640_gmu.bin
    /usr/lib/firmware/qcom/sm8150/xiaomi/nabu/a640_zap.mbn
)
HOOKS=(base systemd modconf kms keyboard sd-vconsole block filesystems sd-btrfs-overlayfs fsck)
